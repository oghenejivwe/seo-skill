# Shape of seo/structure.yaml — the page plan, and the source of truth
# for internal linking for the life of the project.
#
# Links are generated by walking this file. Never by asking a model which
# pages feel related — that produces a web of topical similarity rather
# than a hierarchy, and the hierarchy is what search engines and AI
# systems use to work out what the site is about.

site: https://example.com

# Declared once, never deviated from. Which pattern matters far less
# than consistency. Inconsistency is what actually costs you.
url_pattern: "/<category>/<item>"

# Optional. Only present for projects with a physical location —
# see references/07-local.md
local:
  nap:
    name: ""
    address: ""
    phone: ""
  primary_category: ""
  secondary_categories: []
  service_areas: []

pages:
  - url: /
    type: home                  # home | feature | pricing | comparison | alternative
                                # integration | use-case | guide | glossary | tool | docs
    cluster: ""                 # cluster id from seo/keywords.csv
    primary_keyword: ""         # the cluster head. drives url, title, h1, opening line
    secondary_keywords: []      # same page, no separate action
    traffic_potential: 0        # sum of cluster volume
    intent: commercial          # informational | commercial | transactional | navigational

    # The three places Google reads to decide what this page is about.
    # All three carry primary_keyword, and all three are written HERE, in
    # phase 2, not discovered later while drafting. scripts/plan_check.py
    # blocks phase 3 until they are filled.
    title: ""                   # <= 60 chars, keyword front-loaded, unique sitewide
    h1: ""                      # mirrors the title. not a tagline
    lede: ""                    # the first sentence of body copy, rendered as
                                # the first <p> under the H1 and ABOVE any
                                # interface. Answers the query in one sentence.
                                # This is the slot template furniture steals.
    meta: ""                    # 150-160 chars, ends with a reason to click.
                                # Not a ranking factor -- Google rewrites many
                                # of them -- but free to do while you are here

    parent: null                # url of the page above this one
    links_to: []                # editorial links OUT, in body copy, not nav
    schema: [Organization, WebSite]

    # What the human must supply before this page can be written.
    # If the project has none of these yet, stop and ask — do not
    # generate around the hole.
    requires:
      stories: 1
      stats: 2
      original_images: 1
      opinion: 1

    status: planned             # planned | drafted | reviewed | live
    published: null             # ISO date. drives the review cadence
    notes: ""

  - url: /features/thing
    type: feature
    cluster: ""
    primary_keyword: ""
    parent: /
    links_to: [/compare/thing-vs-other, /pricing]
    schema: [SoftwareApplication]
    status: planned

# Batching. There is no ramp and no cap -- Google defines scaled content
# abuse by intent, not by page count or publishing rate. Batch by page type
# so the Page Indexing report after each batch tells you whether that
# template works. A batch spread across eight page types teaches nothing.
batches:
  - type: converter          # ship every page of one type together
    gate: quality            # capability verified in code, duplicate check
                             # passed, keyword in title + H1 + first <p>,
                             # every FAQ answer opening with the answer
    status: planned
  - type: platform
    gate: quality
    status: planned

# Review cadence after launch. See references/09-review.md -- the question
# worth asking depends on how old the page is.
review:
  launch_plus_7: indexing only
  launch_plus_21: read the queries Search Console reports, retitle to match
  launch_plus_60: full loop, first point at which positions are trustworthy
  then: monthly
